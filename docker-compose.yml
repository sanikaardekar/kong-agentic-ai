services:
  job-service:
    build: ./job-service
    container_name: job-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERPAPI_KEY=${SERPAPI_KEY}
    networks:
      - app-network

  email-service:
    build: ./email-service
    container_name: email-service
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama2
    networks:
      - app-network

  email-finder-service:
    build: ./email-finder-service
    container_name: email-finder-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}
    networks:
      - app-network

  agent-service:
    build: ./agent-service
    container_name: agent-service
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    networks:
      - app-network
    depends_on:
      - job-service
      - email-service
      - email-finder-service

networks:
  app-network:
    driver: bridge