services:
  job-service:
    build: ./job-service
    container_name: job-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERPAPI_KEY=${SERPAPI_KEY}

  email-service:
    build: ./email-service
    container_name: email-service
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama2

  email-finder-service:
    build: ./email-finder-service
    container_name: email-finder-service
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}

  kong:
    image: kong:3.9
    container_name: kong-gateway
    depends_on:
      - job-service
      - email-service
      - email-finder-service
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yaml:/etc/kong/kong.yaml:ro
    ports:
      - "8000:8000"  # proxy (HTTP)
      - "8443:8443"  # proxy (HTTPS)
      - "8001:8001"  # admin API (HTTP)