_format_version: "3.0"
_transform: true

services:
  # AI Gateway Service - Multi-provider AI routing
  - name: ai-gateway-service
    url: http://ai-gateway-service:7000
    retries: 3
    connect_timeout: 30000
    read_timeout: 120000
    write_timeout: 120000
    routes:
      - name: ai-chat-route
        paths: ["/ai/chat"]
        strip_path: false
        methods: ["POST", "OPTIONS"]
      - name: ai-email-route
        paths: ["/ai/email"]
        strip_path: false
        methods: ["POST", "OPTIONS"]
      - name: ai-providers-route
        paths: ["/ai/providers"]
        strip_path: false
        methods: ["GET", "OPTIONS"]
      - name: ai-switch-route
        paths: ["/ai/switch-model"]
        strip_path: false
        methods: ["POST", "OPTIONS"]

  # Job Service
  - name: job-service
    url: http://job-service:3000
    retries: 3
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: job-route
        paths: ["/jobs"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  # Email Service (now routes through AI proxy)
  - name: email-service
    url: http://email-service:4000
    routes:
      - name: email-route
        paths: ["/email"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  # Email Finder Service
  - name: email-finder-service
    url: http://email-finder-service:5000
    routes:
      - name: email-finder-route
        paths: ["/emails"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  # Agent Service (now enhanced with AI routing)
  - name: agent-service
    url: http://agent-service:6000
    routes:
      - name: agent-route
        paths: ["/chat"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]
      - name: agent-health-route
        paths: ["/agent/health"]
        strip_path: true
        methods: ["GET"]

  # Health Service
  - name: health-service
    url: http://agent-service:6000
    routes:
      - name: health-route
        paths: ["/health"]
        strip_path: false
        methods: ["GET"]

plugins:
  # Global CORS
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Auth-Token", "apikey", "X-AI-Provider"]
      exposed_headers: ["X-Auth-Token", "X-AI-Provider", "X-AI-Model"]
      credentials: true
      max_age: 3600

  # Authentication for all services
  - name: key-auth
    service: job-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: email-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: email-finder-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: agent-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: ai-gateway-service
    config:
      key_names: ["apikey"]

  # Rate Limiting for AI services
  - name: rate-limiting
    service: ai-gateway-service
    config:
      minute: 10
      hour: 100
      policy: local
      fault_tolerant: true
  - name: rate-limiting
    service: email-service
    config:
      minute: 20
      policy: local
      fault_tolerant: true

  # Caching for job searches
  - name: proxy-cache
    service: job-service
    config:
      response_code: [200]
      request_method: ["POST"]
      content_type: ["application/json"]
      cache_ttl: 300
      strategy: memory

  # Request transformation
  - name: request-transformer
    service: job-service
    config:
      add:
        headers:
          - "User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          - "Accept:text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"

  # Response transformation
  - name: response-transformer
    service: job-service
    config:
      remove:
        headers:
          - "X-Kong-Upstream-Latency"
          - "X-Kong-Proxy-Latency"
      add:
        headers:
          - "X-AI-Gateway:Kong-AI"

consumers:
  - username: hackathon-user
    keyauth_credentials:
      - key: hackathon-2024-key
  - username: ai-user
    keyauth_credentials:
      - key: ai-gateway-2024-key