_format_version: "3.0"
_transform: true

services:
  - name: job-service
    url: http://job-service:3000
    routes:
      - name: job-service-route
        paths: ["/jobs"]
        strip_path: false
        methods: ["GET"]
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip

  - name: email-service
    url: http://email-service:4000
    routes:
      - name: email-service-route
        paths: ["/email"]
        strip_path: true
        methods: ["POST"]
        plugins:
          - name: key-auth
          - name: rate-limiting
            config:
              minute: 20
              policy: local
              limit_by: consumer

consumers:
  - username: email-user
    keyauth_credentials:
      - key: demo-key-123