_format_version: "3.0"
_transform: true

services:
  - name: job-service
    url: http://job-service:3000
    retries: 3
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: job-route
        paths: ["/jobs"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  - name: email-service
    url: http://email-service:4000
    routes:
      - name: email-route
        paths: ["/email"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  - name: email-finder-service
    url: http://email-finder-service:5000
    routes:
      - name: email-finder-route
        paths: ["/emails"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]

  - name: agent-service
    url: http://agent-service:6000
    routes:
      - name: agent-route
        paths: ["/chat"]
        strip_path: false
        methods: ["GET", "POST", "OPTIONS"]
      - name: agent-health-route
        paths: ["/agent/health"]
        strip_path: true
        methods: ["GET"]

  - name: health-service
    url: http://agent-service:6000
    routes:
      - name: health-route
        paths: ["/health"]
        strip_path: false
        methods: ["GET"]

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "X-Auth-Token", "apikey"]
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600
  - name: key-auth
    service: job-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: email-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: email-finder-service
    config:
      key_names: ["apikey"]
  - name: key-auth
    service: agent-service
    config:
      key_names: ["apikey"]
  - name: rate-limiting
    service: email-service
    config:
      minute: 20
      policy: local
      fault_tolerant: true
  - name: proxy-cache
    service: job-service
    config:
      response_code: [200]
      request_method: ["POST"]
      content_type: ["application/json"]
      cache_ttl: 300
      strategy: memory
  - name: request-transformer
    service: job-service
    config:
      add:
        headers:
          - "User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          - "Accept:text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  - name: response-transformer
    service: job-service
    config:
      remove:
        headers:
          - "X-Kong-Upstream-Latency"
          - "X-Kong-Proxy-Latency"

consumers:
  - username: hackathon-user
    keyauth_credentials:
      - key: hackathon-2024-key